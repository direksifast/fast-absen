name: Cron Reminder Pulang (Saturday)

on:
  schedule:
    - cron: '0 5 * * 6' # 12:00 WIB (Sabtu)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Send Push Notification (Out)
        run: node scripts/github-cron.mjs out
